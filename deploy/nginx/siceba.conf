# ==============================================================================
# SICE-CBA - Servidor Web & Reverse Proxy de Producción On-Premise
# Colegio Bellas Artes • NGINX Hardened Configuration
# TLS 1.3 / Strict HTTPS / CSP / Anti-Clickjacking / Rate Limiting
# ==============================================================================

# Zonas de Rate Limiting en memoria para mitigar ataques DDoS y fuerza bruta
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# Redirección estricta de todo tráfico HTTP (puerto 80) a HTTPS seguro (puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name siceba.bellasartes.edu.ve 192.168.10.50;

    # Ocultar versión del servidor NGINX
    server_tokens off;

    # Redirección 301 permanente con preservación de ruta y Host
    return 301 https://$host$request_uri;
}

# Servidor HTTPS Seguro (TLS 1.3 y TLS 1.2 estricto)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siceba.bellasartes.edu.ve 192.168.10.50;

    # Ocultar firma de versión de NGINX
    server_tokens off;

    # Certificados SSL/TLS (Generados internamente o Let's Encrypt / CA Local CBA)
    ssl_certificate /etc/ssl/siceba/siceba_bundle.crt;
    ssl_certificate_key /etc/ssl/siceba/siceba_private.key;

    # Protocolos y Cifrados Criptográficos Modernos de Alta Seguridad (Mozilla Modern Profile)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Parámetros Diffie-Hellman seguros
    # ssl_dhparam /etc/ssl/siceba/dhparam.pem;

    # Parámetros de Sesión SSL protegida
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # CABECERAS DE SEGURIDAD ESTRICTAS (OWASP Hardening)
    # -------------------------------------------------------------------------

    # HSTS: Obliga a los navegadores a conectarse solo por HTTPS durante 1 año
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Anti-Clickjacking: Bloquea incrustación en iframes no autorizados
    add_header X-Frame-Options "DENY" always;

    # Anti-MIME-Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Protección contra ataques XSS reflejados
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy restrictiva
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: Bloquea uso indebido de hardware del cliente
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Content Security Policy (CSP): Mitigación estricta de XSS y exfiltración de datos
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com; connect-src 'self' http://localhost:54321 https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # Raíz estática de la aplicación compilada (Vite SPA)
    root /var/www/siceba/dist;
    index index.html;

    # Límites de tamaño de peticiones para evitar agotamiento de memoria
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Deshabilitar métodos HTTP no utilizados
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$ ) {
        return 405;
    }

    # Bloqueo de acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueo de acceso directo a archivos de backup o scripts de infraestructura
    location ~* \.(sql|bak|sh|conf|key|pem|crt)$ {
        deny all;
    }

    # Rate limiting especial sobre endpoints sensibles o rutas de login
    location ~* ^/(auth|login) {
        limit_req zone=auth_limit burst=3 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Manejo de Vite React SPA (Enrutamiento del lado del cliente)
    location / {
        limit_req zone=api_general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Cacheo seguro de activos estáticos inmutables (hashes de Vite)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Logs de acceso y error dedicados para auditoría
    access_log /var/log/nginx/siceba_access.log combined;
    error_log /var/log/nginx/siceba_error.log warn;
}
