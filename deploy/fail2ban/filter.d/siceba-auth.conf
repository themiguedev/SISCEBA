# SICE-CBA - Filtro de Detección de Intentos Fallidos de Autenticación
# ==============================================================================

[Definition]
failregex = ^<HOST> - .* "(?:POST|GET) /auth/login.*" (?:401|403|429)
            ^<HOST> - .* "POST /rest/v1/rpc/login.*" (?:401|403|429)
ignoreregex =
